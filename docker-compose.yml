# docker-compose.yml - Orquestacion completa del sistema
# SCY1101 EFT | Accidentes de Trafico Espana 2024
# Servicios: etl | models | api | dashboard
#
# Uso:
#   1. Copiar accidentes_limpios.csv en ./data/
#   2. docker-compose up --build
#   3. Dashboard: http://localhost:8050
#   4. API docs:  http://localhost:8000/docs

services:

  # -- SERVICIO ETL --
  etl:
    build:
      context: .
      dockerfile: docker/Dockerfile.etl
    container_name: ep3_etl
    env_file: .env
    environment:
      - CSV_PATH=/data/accidentes_limpios.csv
      - SQLITE_PATH=/data/accidentes_ep3.db
    volumes:
      - ./data:/data
    networks:
      - ep3_net
    restart: "no"

  # -- SERVICIO ML (entrena modelos) --
  models:
    build:
      context: .
      dockerfile: docker/Dockerfile.models
    container_name: ep3_models
    env_file: .env
    environment:
      - CSV_PATH=/data/accidentes_limpios.csv
      - MODELS_DIR=/app/models
    volumes:
      - ./data:/data
      - ./models:/app/models
    depends_on:
      - etl
    networks:
      - ep3_net
    restart: "no"

  # -- SERVICIO API --
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: ep3_api
    env_file: .env
    environment:
      - SQLITE_PATH=/data/accidentes_ep3.db
      - CSV_PATH=/data/accidentes_limpios.csv
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
      - ./models:/app/models
    depends_on:
      - models
    networks:
      - ep3_net
    restart: unless-stopped

  # -- SERVICIO DASHBOARD --
  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    container_name: ep3_dashboard
    env_file: .env
    environment:
      - SQLITE_PATH=/data/accidentes_ep3.db
      - CSV_PATH=/data/accidentes_limpios.csv
      - DASH_PORT=8050
    ports:
      - "8050:8050"
    volumes:
      - ./data:/data
    depends_on:
      - etl
    networks:
      - ep3_net
    restart: unless-stopped

networks:
  ep3_net:
    driver: bridge

volumes:
  data:
